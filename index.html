<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Landing Page -->
    <div id="landing-page" class="landing-page">
        <div class="background-image"></div>
        <div class="logo-container" id="logo-container">
            <img src="logo.png" alt="Logo" class="logo-image">
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Welcome Back</h2>
                <p>Sign in to continue</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="error-message" id="error-message"></div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Table View -->
    <div id="table-view" class="table-view">
        <div class="table-container">
            <div class="table-header">
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>LinkedIn</th>
                        <th>Edition</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td>Sarah Johnson</td>
                        <td><a href="https://linkedin.com/in/sarahjohnson" target="_blank">linkedin.com/in/sarahjohnson</a></td>
                        <td>f25</td>
                    </tr>
                    <tr>
                        <td>Michael Chen</td>
                        <td><a href="https://linkedin.com/in/michaelchen" target="_blank">linkedin.com/in/michaelchen</a></td>
                        <td>f25</td>
                    </tr>
                    <tr>
                        <td>Emily Rodriguez</td>
                        <td><a href="https://linkedin.com/in/emilyrodriguez" target="_blank">linkedin.com/in/emilyrodriguez</a></td>
                        <td>f25</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
